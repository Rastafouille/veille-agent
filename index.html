let unreadByTab = {};

function articleRating(article){
  return Number.isFinite(Number(article.rating))
    ? Number(article.rating)
    : 5;
}

function sortArticlesByDate(articles){

  return [...articles].sort((a, b) => {

    const dateA =
      a.published_at
        ? new Date(a.published_at).getTime()
        : 0;

    const dateB =
      b.published_at
        ? new Date(b.published_at).getTime()
        : 0;

    if(dateB !== dateA){
      return dateB - dateA;
    }

    return (b.id || 0) - (a.id || 0);

  });

}

function getArticleCard(articleId){
  return document.querySelector(
    `[data-article-id="${articleId}"]`
  );
}

function computeUnreadCounts(articles){

  const counts = {};

  articles.forEach(article => {

    if(!article.is_new) return;

    const slug =
      article.category;

    if(!slug) return;

    counts[slug] =
      (counts[slug] || 0) + 1;

  });

  return counts;

}

function updateTabButtonLabel(tabSlug){

  const button =
    document.querySelector(
      `.tab-button[data-tab-slug="${tabSlug}"]`
    );

  if(!button) return;

  const name =
    button.dataset.tabName || tabSlug;

  const count =
    unreadByTab[tabSlug] || 0;

  button.innerText =
    count > 0
      ? `👤 ${name} (${count})`
      : `👤 ${name}`;

}

function updateAllTabBadges(){

  document
    .querySelectorAll('.tab-button[data-tab-slug]')
    .forEach(button => {
      updateTabButtonLabel(
        button.dataset.tabSlug
      );
    });

}

function adjustUnreadCount(tabSlug, delta){

  if(!tabSlug || !delta) return;

  unreadByTab[tabSlug] =
    Math.max(
      0,
      (unreadByTab[tabSlug] || 0) + delta
    );

  updateTabButtonLabel(tabSlug);

}

function bindReadButton(button, articleId, isNew){
  button.title =
    isNew
      ? 'Marquer comme lu'
      : 'Déjà lu';
  button.textContent =
    isNew
      ? '🆕'
      : '✅';
  button.onclick =
    () => toggleRead(articleId, isNew);
}

function bindRatingButtons(card, articleId, rating){
  const buttons =
    card.querySelectorAll('.rating-btn');

  const valueEl =
    card.querySelector('.rating-value');

  if(valueEl){
    valueEl.textContent =
      `⭐ ${rating}/10`;
  }

  if(buttons.length >= 2){
    buttons[0].onclick =
      () => changeRating(articleId, rating, -1);
    buttons[1].onclick =
      () => changeRating(articleId, rating, 1);
  }
}

  const rating =
    articleRating(article);

    document.createElement('div');

  card.className = 'card';
  card.dataset.articleId = article.id;
  card.dataset.tabSlug = article.category || '';

function removeArticleCard(articleId){

function buildResearchInputTag(input){

    document.createElement('div');

  tag.textContent = input.input + ' ';

function loadMeta(){

  const lastDate =

    meta.next_watch

  document.getElementById('last-watch').innerText =

      : 'Aucune veille lancee';

    nextDate
      ? nextDate.toLocaleString('fr-FR')
      : 'Planifiee le lundi matin';

function renderTabRunSummaries(){

  const metaElement =
    document.getElementById('watch-agent-meta');

  let meta = {};

  try{
    meta = JSON.parse(metaElement.textContent);
  } catch(error){
    console.error('Invalid watch metadata', error);
  }

  (meta.runs || []).forEach(run => {

    const summary =
      document.getElementById(
        `${run.tab_slug}-run-summary`
      );

    const details =
      document.getElementById(
        `${run.tab_slug}-run-details`
      );

    const sourcesList =
      document.getElementById(
        `${run.tab_slug}-scanned-sources`
      );

    if(!summary || !details || !sourcesList) return;

    const displaySources =
      (run.scanned_sources || run.suggested_sources || []);

    const sourceNames =
      displaySources
        .slice(0, 3)
        .map(source => source.name || source)
        .filter(Boolean)
        .join(', ');

    summary.innerText =
      run.summary || run.refined_context ||
      'Aucun résumé pour cet utilisateur.';

    details.innerText =
      `${run.articles_added || 0} article(s) ajoute(s)` +
      (sourceNames ? ` - Sources: ${sourceNames}` : '');

    sourcesList.innerHTML = '';

    if(!displaySources.length){

      const emptyItem =
        document.createElement('li');

      emptyItem.innerText =
        'Aucune source scannée pour le moment.';

      sourcesList.appendChild(emptyItem);
      return;

    }

    displaySources.forEach(source => {

      const item =
        document.createElement('li');

      if(source.url){

        const link =
          document.createElement('a');

        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.innerText = source.name || source.url;

        item.appendChild(link);

      } else {

        item.innerText =
          source.name || source;

      }

      if(source.reason){

        const reason =
          document.createElement('span');

        reason.innerText =
          ` - ${source.reason}`;

        item.appendChild(reason);

      }

      sourcesList.appendChild(item);

    });

  });
}

async function loadWatchConfigs(){

  const { data } =
    await supabaseClient
      .from('watch_configs')
      .select('*');

  data.forEach(cfg => {

    const textarea =
      document.getElementById(

      );

}

async function savePrompt(tabSlug){

  const textarea =
    document.getElementById(
      `${tabSlug}-prompt`
    );

  const button =
    document.getElementById(
      `${tabSlug}-save-btn`
    );

  const prompt =
    textarea.value;

  const { data } =
    await supabaseClient
      .from('watch_configs')
      .select('*')
      .eq('tab_slug', tabSlug);

  if(data.length > 0){

    await supabaseClient
      .from('watch_configs')
      .update({
        prompt
      })
      .eq('tab_slug', tabSlug);

  } else {

    await supabaseClient
      .from('watch_configs')
      .insert([{
        tab_slug: tabSlug,
        prompt
      }]);

  }

  // feedback visuel

  const originalText =
    button.innerHTML;

  button.innerHTML =
    '✅ Sauvegardé';

  button.style.background =
    '#1f9d55';

  setTimeout(() => {

    button.innerHTML =
      originalText;

    button.style.background =
      '#222';

  }, 1800);

}

function formatTabEmailError(error){

  const message =
    error?.message || '';

  if(
    message.includes('notification_email') ||
    error?.code === 'PGRST204'
  ){
    return "Colonne notification_email absente : executez la migration SQL dans Supabase (voir supabase/migrations/).";
  }

  if(error?.code === '42501'){
    return "Droits insuffisants (RLS) : autorisez la mise a jour de la table tabs pour le role anon.";
  }

  return message || "Erreur inconnue lors de l'enregistrement.";
}

async function saveTabEmail(tabSlug){

  const input =
    document.getElementById(
      `${tabSlug}-email`
    );

  const button =
    document.getElementById(
      `${tabSlug}-email-save`
    );

  const status =
    document.getElementById(
      `${tabSlug}-email-status`
    );

  if(!input || !button) return;

  const email =
    input.value.trim();

  const originalText =
    button.innerHTML;

  button.disabled = true;
  button.innerHTML = '⏳ Enregistrement...';

  if(status){
    status.style.color = '#666';
    status.innerText = '';
  }

  const { data, error } =
    await supabaseClient
      .from('tabs')
      .update({
        notification_email: email || null
      })
      .eq('slug', tabSlug)
      .select('slug, notification_email');

  button.disabled = false;

  if(error){
    console.error(error);
    button.innerHTML = originalText;
    if(status){
      status.style.color = '#c20000';
      status.innerText =
        formatTabEmailError(error);
    }
    return;
  }

  if(!data || data.length === 0){
    button.innerHTML = originalText;
    if(status){
      status.style.color = '#c20000';
      status.innerText =
        "Aucune ligne mise a jour. Verifiez le slug de l'onglet et les politiques RLS (UPDATE) sur tabs.";
    }
    return;
  }

  button.innerHTML =
    '✅ Enregistre';

  button.style.background =
    '#1f9d55';

  if(status){
    status.style.color = '#1f9d55';
    status.innerText =
      email
        ? `Email enregistre : ${data[0].notification_email}`
        : 'Email supprime.';
  }

  setTimeout(() => {

    button.innerHTML =
      originalText;

    button.style.background =
      '#666';

  }, 1800);

}

async function loadResearchInputs(){

  const { data } =
    await supabaseClient
      .from('research_inputs')
      .select('*')
      .order('created_at');

  data.forEach(input => {

    const container =
      document.getElementById(
        `${input.tab_slug}-inputs`

    );

async function addResearchInput(tabSlug){

  const inputField =
    document.getElementById(
      `${tabSlug}-input`
    );

  const value =
    inputField.value.trim();

  if(!value) return;

  const { data, error } =
    await supabaseClient
      .from('research_inputs')
      .insert([{
        tab_slug: tabSlug,
        input: value
      }])
      .select()
      .single();

  if(error){
    console.error(error);
    return;
  }

  inputField.value = '';

  const container =
    document.getElementById(
      `${tabSlug}-inputs`
    );

  if(container && data){
    container.appendChild(
      buildResearchInputTag(data)
    );
  }

}

async function deleteResearchInput(id){

  const tag =
    document.querySelector(
      `[data-input-id="${id}"]`
    );

  const { error } =
    await supabaseClient
      .from('research_inputs')
      .delete()
      .eq('id', id);

  if(error){
    console.error(error);
    return;
  }

  tag?.remove();

}

        ascending: false,
        nullsFirst: false
      })
      .order('id', {

      });

  articles.forEach(article => {

      document.getElementById(
        `${article.category}-list`
      );

    if(!container) return;

    );

  });

}

async function setArticleReadState(id, isNew){

  const card =
    getArticleCard(id);

  if(!card) return;

  const tabSlug =
    card.dataset.tabSlug;

  const wasNew =
    card.dataset.isNew === 'true';

  if(wasNew === isNew) return;

  const readBtn =
    card.querySelector('.read-btn');

  card.dataset.isNew =
    isNew
      ? 'true'
      : 'false';

  if(readBtn){
    bindReadButton(readBtn, id, isNew);
  }

  const { error } =
    await supabaseClient
      .from('articles')
      .update({
        is_new: isNew
      })
      .eq('id', id);

  if(error){
    console.error(error);
    card.dataset.isNew =
      wasNew
        ? 'true'
        : 'false';
    if(readBtn){
      bindReadButton(readBtn, id, wasNew);
    }
    return;
  }

  if(!tabSlug) return;

  if(!isNew && wasNew){
    adjustUnreadCount(tabSlug, -1);
  }

  if(isNew && !wasNew){
    adjustUnreadCount(tabSlug, 1);
  }

}

async function markArticleAsRead(id){
  await setArticleReadState(id, false);
}

async function toggleRead(id, currentState){
  await setArticleReadState(id, !currentState);
}

async function addStar(id, currentStars){

  const nextStars = currentStars + 1;
  const card = getArticleCard(id);
  const starBtn = card?.querySelector('.star-btn');

  if(starBtn){
    starBtn.textContent = `⭐ ${nextStars}`;
    starBtn.onclick = () => addStar(id, nextStars);
  }

  const { error } =
    await supabaseClient
      .from('articles')
      .update({
        stars: nextStars
      })
      .eq('id', id);

  if(error){
    console.error(error);
    if(starBtn){
      starBtn.textContent = `⭐ ${currentStars}`;
      starBtn.onclick = () => addStar(id, currentStars);
    }
  }

}

async function changeRating(id, currentRating, delta){

  await markArticleAsRead(id);

  const nextRating =
    Math.max(
      0,
      Math.min(10, currentRating + delta)
    );

  const card = getArticleCard(id);

  if(card){
    bindRatingButtons(card, id, nextRating);
  }

  const { error } =
    await supabaseClient
      .from('articles')
      .update({
        rating: nextRating
      })
      .eq('id', id);

  if(error){
    console.error(error);
    if(card){
      bindRatingButtons(card, id, currentRating);
    }
    alert(
      "Impossible de sauvegarder la note. La colonne rating doit exister dans Supabase."
    );
  }

}

async function deleteArticle(id){

  const card =
    getArticleCard(id);

  const tabSlug =
    card?.dataset.tabSlug;

  const wasNew =
    card?.dataset.isNew === 'true';

  removeArticleCard(id);

  if(wasNew && tabSlug){
    adjustUnreadCount(tabSlug, -1);
  }

  const { error } =
    await supabaseClient
      .from('articles')
      .update({
        hidden:true
      })
      .eq('id', id);

  if(error){
    console.error(error);
    await loadArticles();
  }

}

async function addTab(){

  const input =
    document.getElementById(
      'new-tab-input'
    );

  const name =
    input.value.trim();

  if(!name) return;

  const slug =
    name.toLowerCase()
        .replace(/\s+/g, '-');

  await supabaseClient
    .from('tabs')
    .insert([{
      name,
      slug
    }]);

  input.value = '';

  loadTabs();

}

function openTab(tabName, button){

  currentTab = tabName;

  document.querySelectorAll('.tab-content')
    .forEach(tab => {
      tab.classList.remove('active');
    });

  document.querySelectorAll('.tab-button')
    .forEach(btn => {
      btn.classList.remove('active');
    });

  document
    .getElementById(tabName)
    .classList.add('active');

  button.classList.add('active');

}

window.addTab = addTab;
window.savePrompt = savePrompt;
window.saveTabEmail = saveTabEmail;
window.addResearchInput = addResearchInput;
window.deleteResearchInput = deleteResearchInput;
window.addStar = addStar;
window.changeRating = changeRating;
window.deleteArticle = deleteArticle;
window.toggleRead = toggleRead;

window.addEventListener(
  'DOMContentLoaded',
  async () => {

    loadMeta();

    currentTab = null;

    await loadTabs();

  }
);
