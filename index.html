const supabaseClient =

let currentTab = null;

async function reloadTabsKeepingScroll(){

  const scrollX =
    window.scrollX;

  const scrollY =
    window.scrollY;

  await loadTabs();

  requestAnimationFrame(() => {
    window.scrollTo(scrollX, scrollY);
  });

}

function loadMeta(){

  const metaElement =
    document.getElementById('watch-agent-meta');

  let meta = {};

  try{
    meta = JSON.parse(metaElement.textContent);
  } catch(error){
    console.error('Invalid watch metadata', error);
  }

  const lastDate =
    meta.last_watch
      ? new Date(meta.last_watch)
      : null;

  const nextDate =
    meta.next_watch
      ? new Date(meta.next_watch)
      : null;

  document.getElementById('last-watch').innerText =
    lastDate
      ? lastDate.toLocaleString('fr-FR')
      : 'Aucune veille lancee';

  document.getElementById('next-watch').innerText =
    nextDate
      ? nextDate.toLocaleString('fr-FR')
      : 'Planifiee le lundi matin';

}

async function loadTabs(){

  const { data, error } =
    await supabaseClient
      .from('tabs')
      .select('*')
      .order('created_at');

  if(error){
    console.error(error);
    return;
  }

  const tabsContainer =
    document.getElementById('tabs-container');

  const contentContainer =
    document.getElementById('content-container');

  tabsContainer.innerHTML = '';
  contentContainer.innerHTML = '';

  for(let i=0;i<data.length;i++){

    const tab = data[i];

    const isActive =
      currentTab
        ? tab.slug === currentTab
        : i === 0;

    const button =
      document.createElement('button');

    button.className = 'tab-button';

    if(isActive){
      button.classList.add('active');
    }

    button.innerText =
      `👤 ${tab.name}`;

    button.onclick = () =>
      openTab(tab.slug, button);

    tabsContainer.appendChild(button);

    const content =
      document.createElement('div');

    content.id = tab.slug;
    content.className = 'tab-content';

    if(isActive){
      content.classList.add('active');
    }

    content.innerHTML = `

      <div class="tab-meta">

        <div class="watch-section">

          <h3>Résumé du dernier run</h3>

          <p id="${tab.slug}-run-summary"
             style="margin-top:10px;">

             class="run-details">

        onclick="savePrompt('${tab.slug}')"

      </div>

    `;

    contentContainer.appendChild(content);

  }

  await loadWatchConfigs();
  await loadResearchInputs();
  await loadArticles();
  renderTabRunSummaries();

}

function renderTabRunSummaries(){

  const metaElement =
    document.getElementById('watch-agent-meta');

  let meta = {};

  try{
    meta = JSON.parse(metaElement.textContent);
  } catch(error){
    console.error('Invalid watch metadata', error);
  }

  (meta.runs || []).forEach(run => {

    const summary =
      document.getElementById(
        `${run.tab_slug}-run-summary`
      );

    const details =
      document.getElementById(
        `${run.tab_slug}-run-details`
      );

    const sourcesList =
      document.getElementById(
        `${run.tab_slug}-scanned-sources`
      );

    if(!summary || !details || !sourcesList) return;

    const displaySources =
      (run.scanned_sources || run.suggested_sources || []);

    const sourceNames =
      displaySources
        .slice(0, 3)
        .map(source => source.name || source)
        .filter(Boolean)
        .join(', ');

    summary.innerText =
      run.summary || run.refined_context ||
      'Aucun résumé pour cet utilisateur.';

    details.innerText =
      `${run.articles_added || 0} article(s) ajoute(s)` +
      (sourceNames ? ` - Sources: ${sourceNames}` : '');

    sourcesList.innerHTML = '';

    if(!displaySources.length){

      const emptyItem =
        document.createElement('li');

      emptyItem.innerText =
        'Aucune source scannée pour le moment.';

      sourcesList.appendChild(emptyItem);
      return;

    }

    displaySources.forEach(source => {

      const item =
        document.createElement('li');

      if(source.url){

        const link =
          document.createElement('a');

        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.innerText = source.name || source.url;

        item.appendChild(link);

      } else {

        item.innerText =
          source.name || source;

      }

      if(source.reason){

        const reason =
          document.createElement('span');

        reason.innerText =
          ` - ${source.reason}`;

        item.appendChild(reason);

      }

      sourcesList.appendChild(item);

    });

  });
}

async function loadWatchConfigs(){

  const { data } =
    await supabaseClient
      .from('watch_configs')
      .select('*');

  data.forEach(cfg => {

    const textarea =
      document.getElementById(
        `${cfg.tab_slug}-prompt`
      );

    if(textarea){
      textarea.value = cfg.prompt;
    }

  });

}

async function savePrompt(tabSlug){

  const textarea =
    document.getElementById(
      `${tabSlug}-prompt`
    );

  const button =
    document.getElementById(
      `${tabSlug}-save-btn`
    );

  const prompt =
    textarea.value;

  const { data } =
    await supabaseClient
      .from('watch_configs')
      .select('*')
      .eq('tab_slug', tabSlug);

  if(data.length > 0){

    await supabaseClient
      .from('watch_configs')
      .update({
        prompt
      })
      .eq('tab_slug', tabSlug);

  } else {

    await supabaseClient
      .from('watch_configs')
      .insert([{
        tab_slug: tabSlug,
        prompt
      }]);

  }

  // feedback visuel

  const originalText =
    button.innerHTML;

  button.innerHTML =
    '✅ Sauvegardé';

  button.style.background =
    '#1f9d55';

  setTimeout(() => {

    button.innerHTML =
      originalText;

    button.style.background =
      '#222';

  }, 1800);

}

async function loadResearchInputs(){

  const { data } =
    await supabaseClient
      .from('research_inputs')
      .select('*')
      .order('created_at');

  data.forEach(input => {

    const container =
      document.getElementById(
        `${input.tab_slug}-inputs`
      );

    if(!container) return;

    const tag =
      document.createElement('div');

    tag.className =
      'input-tag';

    tag.innerHTML = `
      ${input.input}

      <button onclick="deleteResearchInput(${input.id})"
              style="
                margin-left:8px;
                border:none;
                background:none;
                color:red;
                cursor:pointer;
              ">
        ✖
      </button>
    `;

    container.appendChild(tag);

  });

}

async function addResearchInput(tabSlug){

  const inputField =
    document.getElementById(
      `${tabSlug}-input`
    );

  const value =
    inputField.value.trim();

  if(!value) return;

  await supabaseClient
    .from('research_inputs')
    .insert([{
      tab_slug: tabSlug,
      input: value
    }]);

  inputField.value = '';

  reloadTabsKeepingScroll();

}

async function deleteResearchInput(id){

  await supabaseClient
    .from('research_inputs')
    .delete()
    .eq('id', id);

  reloadTabsKeepingScroll();

}

async function loadArticles(){

  const { data } =
    await supabaseClient
      .from('articles')
      .select('*')
      .eq('hidden', false)
      .order('published_at',
             { ascending:false });

  data.forEach(article => {

    const rating =
      Number.isFinite(Number(article.rating))
        ? Number(article.rating)
        : 5;

    const container =
      document.getElementById(
        `${article.category}-list`
      );

    if(!container) return;

    const card =
      document.createElement('div');

    card.className = 'card';

    card.innerHTML = `

      <div>
        <span class="badge ${article.type}">
          ${article.type === 'science'
            ? 'Article scientifique'
            : 'Article presse'}
        </span>
      </div>

      <div class="card-header">

        <h3 class="card-title">
          ${article.title}
        </h3>

        <button
          class="read-btn"
          onclick="toggleRead(${article.id}, ${article.is_new})"

          title="${
            article.is_new
              ? 'Marquer comme lu'
              : 'Déjà lu'
          }"
        >

          ${
            article.is_new
              ? '🆕'
              : '✅'
          }

        </button>

      </div>

      <p class="article-meta">
        📅 ${
          article.published_at
            ? new Date(article.published_at)
                .toLocaleDateString('fr-FR')
            : 'Date inconnue'
        }
      </p>

      <p class="article-description collapsed"
         id="article-description-${article.id}">
        ${article.description || ''}
      </p>

      <button class="more-btn"
              onclick="toggleDescription(${article.id}, this)"
              style="${article.description ? '' : 'display:none;'}">
        Voir plus
      </button>

      <a class="article-link"
         href="${article.link}"
         target="_blank">
        Lire l'article →
      </a>

      <div class="actions">

        <div class="rating-control"
             title="Note utilisee par l'agent pour orienter la veille">

          <button class="rating-btn"
                  onclick="changeRating(${article.id}, ${rating}, -1)">
            -
          </button>

          <span class="rating-value">
            ⭐ ${rating}/10
          </span>

          <button class="rating-btn"
                  onclick="changeRating(${article.id}, ${rating}, 1)">
            +
          </button>

        </div>

        <button class="star-btn"
                onclick="addStar(${article.id}, ${article.stars})">
          ⭐ ${article.stars}
        </button>

        <button class="delete-btn"
                onclick="deleteArticle(${article.id})">
          Supprimer
        </button>

      </div>
    `;

    container.appendChild(card);

  });

}

async function toggleRead(id, currentState){

  await supabaseClient
    .from('articles')
    .update({
      is_new: !currentState
    })
    .eq('id', id);

  reloadTabsKeepingScroll();

}

function toggleDescription(id, button){

  const description =
    document.getElementById(
      `article-description-${id}`
    );

  if(!description) return;

  const isCollapsed =
    description.classList.toggle('collapsed');

  button.innerText =
    isCollapsed
      ? 'Voir plus'
      : 'Reduire';

}

async function addStar(id, currentStars){

  await supabaseClient
    .from('articles')
    .update({
      stars: currentStars + 1
    })
    .eq('id', id);

  reloadTabsKeepingScroll();

}

async function changeRating(id, currentRating, delta){

  const nextRating =
    Math.max(
      0,
      Math.min(10, currentRating + delta)
    );

  const { error } =
    await supabaseClient
      .from('articles')
      .update({
        rating: nextRating
      })
      .eq('id', id);

  if(error){
    console.error(error);
    alert(
      "Impossible de sauvegarder la note. La colonne rating doit exister dans Supabase."
    );
    return;
  }

  reloadTabsKeepingScroll();

}

async function deleteArticle(id){

  await supabaseClient
    .from('articles')
    .update({
      hidden:true
    })
    .eq('id', id);

  reloadTabsKeepingScroll();

}

async function addTab(){

  const input =
    document.getElementById(
      'new-tab-input'
    );

  const name =
    input.value.trim();

  if(!name) return;

  const slug =
    name.toLowerCase()
        .replace(/\s+/g, '-');

  await supabaseClient
    .from('tabs')
    .insert([{
      name,
      slug
    }]);

  input.value = '';

  loadTabs();

}

function openTab(tabName, button){

  currentTab = tabName;

  document.querySelectorAll('.tab-content')
    .forEach(tab => {
      tab.classList.remove('active');
    });

  document.querySelectorAll('.tab-button')
    .forEach(btn => {
      btn.classList.remove('active');
    });

  document
    .getElementById(tabName)
    .classList.add('active');

  button.classList.add('active');

}

window.addTab = addTab;
window.savePrompt = savePrompt;
window.addResearchInput = addResearchInput;
window.deleteResearchInput = deleteResearchInput;
window.addStar = addStar;
window.changeRating = changeRating;
window.toggleDescription = toggleDescription;
window.deleteArticle = deleteArticle;
window.toggleRead = toggleRead;

window.addEventListener(
  'DOMContentLoaded',
  async () => {

    loadMeta();

    currentTab = null;

    await loadTabs();

  }
);

</script>

</body>
</html>
